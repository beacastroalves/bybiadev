<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />

    <!-- Auto-deteção de idioma (SÓ na raiz "/"). Redireciona o visitante real para o
         seu locale antes do React montar. Ignora bots (o Google indexa o x-default PT-PT)
         e respeita a escolha manual guardada em localStorage. /br e /en nunca redirecionam. -->
    <script>
      (function () {
        try {
          if (location.pathname !== "/") return;
          var ua = navigator.userAgent || "";
          if (/bot|crawl|spider|slurp|mediapartners|bingpreview|google|bing|yandex|duckduck|baidu/i.test(ua)) return;
          var pref = null;
          try { pref = localStorage.getItem("bybia_lang"); } catch (e) {}
          if (pref === "pt-PT") return;
          if (pref === "pt-BR") { location.replace("/br/"); return; }
          if (pref === "en") { location.replace("/en/"); return; }
          var l = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
          if (l.indexOf("pt") === 0) {
            if (l.indexOf("br") !== -1) location.replace("/br/");
            // pt-pt ou "pt" genérico → fica em "/"
          } else {
            location.replace("/en/");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Título, description, canonical, hreflang e OG/Twitter localizados são geridos
         POR ROTA pelo <Head> (React) em src/pages/Layout.tsx — um por locale (/, /br, /en).
         Aqui ficam só as tags comuns a todos os locales. -->
    <meta name="keywords" content="criar site, fazer site, comprar site, criar sites, fazer sites, criação de sites, site profissional, Beatriz Castro, ByBia.dev, landing pages, websites institucionais, dev independente, Portugal" />
    <meta name="author" content="ByBia.dev" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter — partes comuns (imagem, tipo, card) -->

    <meta property="twitter:image" content="https://bybia.dev/og-image.png" />
